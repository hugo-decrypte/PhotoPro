networks:
  photopro.net:
    driver: bridge

services:
  web.photopro:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web/photo-pro-backoffice:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - photopro.net
    depends_on:
      - app-gateway-gestion

  app-gateway-gestion:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    volumes:
      - ./api/gateway/:/var/php
    working_dir: /var/php
    ports:
      - "6080:80"
    networks:
      - photopro.net
    depends_on:
      - rabbitmq
      - seaweed-s3
      - mailer
      - app-auth
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  app-auth:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    volumes:
      - ./api/app-auth/:/var/php
    working_dir: /var/php
    networks:
      - photopro.net
    depends_on:
      - photopro-auth.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"

  app-gallery:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    volumes:
      - ./api/app-gallery:/var/php
    working_dir: /var/php
    ports:
      - "6081:80"
    networks:
      - photopro.net
    depends_on:
      - photopro-gallery.db
    command: sh -c "composer install && php -S 0.0.0.0:80 -t public"

  app-photo:
        build:
          context: build
          dockerfile: 8.5-cli.Dockerfile
        volumes:
          - ./api/app-photo:/var/php
        working_dir: /var/php
        ports:
          - "6082:80"
        networks:
          - photopro.net
        depends_on:
          - photopro-photo.db
          - seaweed-s3
        command: sh -c "composer install && php -S 0.0.0.0:80 -t public"

  photopro-gallery.db:
    image: postgres:latest
    environment:
      POSTGRES_USER: photopro
      POSTGRES_PASSWORD: photopro
      POSTGRES_DB: photopro
    networks:
      - photopro.net
    volumes:
      - ./sql/photopro-gallery.schema.sql:/docker-entrypoint-initdb.d/03.schema.sql

  photopro-auth.db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: photopro
      POSTGRES_PASSWORD: photopro
      POSTGRES_DB: photopro
    networks:
      - photopro.net
    volumes:
      - ./sql/photopro-auth.schema.sql:/docker-entrypoint-initdb.d/03.schema.sql
      - ./sql/photopro-auth.data.sql:/docker-entrypoint-initdb.d/04.data.sql

  photopro-photo.db:
    image: 'postgres:latest'
    environment:
      POSTGRES_USER: photopro
      POSTGRES_PASSWORD: photopro
      POSTGRES_DB: photopro
    networks:
      - photopro.net
    volumes:
      - ./sql/photopro-photo.schema.sql:/docker-entrypoint-initdb.d/05.schema.sql
      - ./sql/photopro-photo.data.sql:/docker-entrypoint-initdb.d/06.data.sql

  adminer:
    image: adminer
    ports:
      - '8081:8081'
    networks:
      - photopro.net
    command: php -S 0.0.0.0:8081 -t /var/www/html

  # SeaweedFS (S3-compatible storage)
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    command: "master -ip=seaweed-master -ip.bind=0.0.0.0"
    ports:
      - "9333:9333"
    networks:
      - photopro.net
    volumes:
      - ./S3/data:/data

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    command: 'volume -ip=seaweed-volume -master="seaweed-master:9333" -ip.bind=0.0.0.0 -port=8080'
    ports:
      - "8080:8080"
    depends_on:
      - seaweed-master
    networks:
      - photopro.net
    volumes:
      - ./S3/data:/data

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    command: 'filer -ip=seaweed-filer -master="seaweed-master:9333" -ip.bind=0.0.0.0'
    ports:
      - "8888:8888"
    depends_on:
      - seaweed-master
      - seaweed-volume
    networks:
      - photopro.net
    volumes:
      - ./S3/data:/data

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    command: 's3 -filer="seaweed-filer:8888" -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - "8333:8333"
    depends_on:
      - seaweed-filer
    networks:
      - photopro.net
    volumes:
      - ./S3/s3.json:/etc/seaweedfs/s3.json
      - ./S3/data:/data

  # AMQP broker
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - photopro.net

  # SMTP dev catcher
  mailer:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - photopro.net
